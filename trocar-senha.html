<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Troca de senha de clientes - NovaTech</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <main>
    <div class="painel largo">
      <a href="index.html"><img class="logo-form" src="img/logo-escuro.svg" alt="Logo da NovaTech Soluções em TI"></a>
      <h1>Troca de senha de clientes</h1>

      <table class="formulario">
        <tr>
          <td><label for="login">Login (e-mail)</label></td>
          <td><input type="text" id="login" placeholder="seuemail@exemplo.com"></td>
        </tr>
        <tr>
          <td><label for="senha">Nova senha</label></td>
          <td><input type="password" id="senha"></td>
        </tr>
        <tr>
          <td><label for="confirmacao">Confirmação da senha</label></td>
          <td><input type="password" id="confirmacao"></td>
        </tr>
        <tr>
          <td>Regras de composição</td>
          <td><output id="regras" class="instrucoes" style="display: block;"></output></td>
        </tr>
      </table>

      <p id="mensagem" class="mensagem"></p>

      <div class="acoes">
        <button type="button" id="btnTrocar" class="botao primario">Troca Senha</button>
        <button type="button" id="btnLimpar" class="botao">Limpar</button>
      </div>
    </div>
  </main>

  <script src="js/validacoes.js"></script>
  <script src="js/trocar-senha.js"></script>
</body>
</html>
